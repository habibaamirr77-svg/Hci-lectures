<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شرح دروس HCI: الوحدتان 4 و5</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f4;--fg:#1c2a2a;--mut:#55655f;--ac:#0f766e;--on:#fff;--card:#fff;--bd:#d8ddd6;--ok:#15803d;--no:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12191a;--fg:#e8efec;--mut:#9db0aa;--ac:#5fd0c0;--on:#08201c;--card:#1b2527;--bd:#2c3a3c;--ok:#4ade80;--no:#f87171}}
:root[data-theme="dark"]{--bg:#12191a;--fg:#e8efec;--mut:#9db0aa;--ac:#5fd0c0;--on:#08201c;--card:#1b2527;--bd:#2c3a3c;--ok:#4ade80;--no:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.9 Tajawal,Tahoma,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
#bar{height:5px;background:var(--ac);width:0;transition:width .3s}
.top{height:5px;background:var(--bd)}
h1{font-size:1.5rem;margin:.6em 0 .3em}
h2{font-size:1.25rem;margin:.5em 0}
#im{width:100%;max-height:42vh;object-fit:contain;border-radius:10px;background:var(--card);border:1px solid var(--bd)}
ul{padding-inline-start:1.2em;margin:.5em 0}
li{margin-bottom:.6em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
button{font:inherit;padding:.5em 1em;border-radius:8px;border:1px solid var(--ac);background:var(--card);color:var(--fg);cursor:pointer}
button.p{background:var(--ac);color:var(--on);font-weight:700}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.o{display:block;width:100%;text-align:start;margin:8px 0}
.o.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.o.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 18%,var(--card))}
.m{color:var(--mut);font-size:.9rem}
.w{cursor:pointer;border-radius:3px}.w:hover{background:color-mix(in srgb,var(--ac) 22%,transparent)}
#tip{position:absolute;z-index:9;background:var(--ac);color:var(--on);padding:.2em .8em;border-radius:8px;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.25);max-width:70vw}
[hidden]{display:none!important}
#tip a{color:inherit}
</style>
</head>
<body>
<div class="top"><div id="bar"></div></div>
<main>
<div class="row"><button id="lb" onclick="sw()"></button></div>
<section id="pl">
<img id="im" alt="">
<h1 id="t"></h1>
<ul id="l"></ul>
<div class="row">
<button data-k="pv" onclick="go(-1)"></button>
<button data-k="nx" class="p" onclick="go(1)"></button>
<button data-k="qz" onclick="startQuiz()"></button>
<span class="m" id="pg"></span>
</div>
<p class="m" data-k="hint"></p>
</section>
<section id="qz" hidden>
<p class="m" id="qn"></p>
<div id="qb"></div>
</section>
</main>
<div id="tip" hidden></div>

["الوحدة 4 – الدرس 4.1: طبقة الواجهة UI Layer","u",["طبقة الواجهة هي برامج بتشتغل فوق نظام التشغيل وتحت التطبيق، وبتنفّذ التفاعل مع المستخدم.","المقاطعة Interrupt إشارة للمعالج إن حدث وقع ولازم يتعامل معاه، فيوقف شغله مؤقتًا ثم يكمل.","عكسها الاستطلاع Polling أو الانتظار المشغول: المعالج يلف في حلقة ويسأل الجهاز كل شوية، وده بيضيّع وقته ومش مناسب لإدخال المستخدم العشوائي.","عشان كده البرامج التفاعلية تستخدم العمارة المبنية على الأحداث Event-Driven: برنامج مكتوب بدلالة أحداث (ضغطة ماوس، لمسة، لوحة مفاتيح) ومعالجات لها."]],
["الأحداث والعناصر والمعالجات","c",["النافذة Window أبسط عنصر واجهة: مستطيل من الشاشة للتفاعل. والتطبيق له نافذة عليا فيها كل العناصر Widgets: أزرار وقوائم وأيقونات ونماذج وصناديق حوار.","الخطوات: أولًا إدخال مادي من جهاز الإدخال. ثانيًا يتحول لحدث Event فيه نية المستخدم. ثالثًا نظام التشغيل يحطه في طابور أحداث التطبيق. رابعًا يتوزع حسب التركيز الحالي على معالج الحدث المناسب.","هيكل البرنامج: تجهّز العناصر وتربط كل واحد بمعالجه، وبعدين تدخل حلقة مستمرة بتسحب الأحداث من الطابور وتوزعها. مثال الصورة: ضغط “ادفع الآن” في سلة المشتريات يتحول لحدث، يدخل الطابور، والموزّع يشوف التركيز ويشغّل معالج الدفع."]],
["مثال الوضع الليلي: من اللمسة للحدث","n",["الإدخال المادي: المستخدم يلمس أيقونة القمر. حساس الشاشة يلاقي تغيّر في التيار عند إحداثيات مثل x=120 وy=350، ويبعتها لنظام التشغيل كمقاطعة.","توليد الحدث: النظام ما يمررش الإحداثيات الخام، بل يغلفها في كائن حدث Event Object فيه نوع الفعل TOUCH_DOWN ومكانه ووقته. ده بيحوّل إحساس مادي لرسالة رقمية يفهمها التطبيق.","طابور الأحداث: بنظام FIFO أول داخل أول خارج، فالتطبيق يفضل مستجيب حتى لو مشغول بمهمة تقيلة، والطلب بيستنى دوره."]],
["مثال الوضع الليلي: التوزيع والمعالج",null,["التوزيع: حلقة الأحداث Event Loop هي قلب البرنامج، بتسحب الأحداث واحد واحد وتقارن الإحداثيات بمواقع العناصر، فتلاقيها داخل حدود زر الوضع الليلي وتبعت له الحدث.","معالج الحدث: كل عنصر تفاعلي له معالج Callback فيه المنطق. هنا يغيّر متغير الثيم من فاتح لداكن (تغيير الحالة)، ويطلب من محرك الرسم يخلّي الخلفية سودا ويبدّل القمر بشمس (تحديث الواجهة).","التشبيهات: العنصر مفتاح النور، الحدث خطاب في ظرف، الطابور صندوق وارد على مكتب، الحلقة ماكينة فرز، المعالج كتيب التعليمات."]],
["أطقم الواجهة UI Toolkits",null,["المطورون نادرًا يبنوا النظام من الصفر؛ بيستخدموا UI Toolkit: مكتبة عناصر جاهزة مع معالجاتها ومجموعة أحداث معرّفة فوق إطار التنفيذ. فايدتها: توحيد وألفة وسرعة تنفيذ واتساق على المنصة.","Java AWT: مكتبة كائنية لإنشاء واجهات ورسومات ثنائية الأبعاد.","Android: العناصر (صور وأزرار) تتعرّف تصريحيًا في ملفات XML، والمعالجات بكود Java.","iOS UIKit: بيتعامل مع ثلاثة أنواع أحداث: اللمس المتعدد والحركة والتحكم عن بعد. يلتقط اللمسات ويغلفها في UIEvent ويحطها في طابور التطبيق ليعالجها الـ View."]],
["إطار MVC: النموذج والعرض والمتحكم","m",["MVC إطار تطوير معياري مبدؤه فصل الواجهة عن الوظائف الحسابية، فنقدر نخلط ونبدل ونصون الأجزاء بسهولة. القاعدة: MVC بيفصل اللي بتشوفه عن طريقة حسابه.","Model: البيانات والمنطق والحسابات، وما يعرفش طريقة العرض أو الإدخال. View: مسؤول عن عرض المخرجات. Controller: يستقبل مدخلات المستخدم، يحدد أي View في التركيز، ويكلم الـ Model لتحديث البيانات.","الآلة الحاسبة: الشاشة View بتنور الأرقام بس. الأزرار Controller: ضغطت 2 يبلغ الموديل. الشريحة الداخلية Model: تجمع 2+3=5 وتخزن النتيجة وترجعها للمتحكم اللي يعرضها."]],
["مثال MVC: طلب القهوة والفوائد",null,["View هو المنيو أو القهوة الجاهزة. Controller هو الكاشير. Model هو الباريستا والمطبخ بالمكونات والوصفة.","التسلسل: تشوف المنيو، تقول للكاشير “لاتيه”، الكاشير يبلغ الباريستا، الباريستا يحضّر بالوصفة ويقول “جاهز”، والكاشير يسلّمك اللاتيه.","الفوائد: تصميم منيو جديد يغيّر View والوصفة زي ما هي. كود صحي جديد يغيّر Model والكاشير زي ما هو. تطبيق موبايل للطلب يبدّل Controller والمطبخ ما يتأثرش."]],
["الدرس 4.2: النموذج الأولي Prototype والدقة Fidelity",null,["النموذج الأولي تعبير عن نية التصميم؛ بيخلي المصمم يعرض فكرته ويتواصل مع الفريق ويشوفها شغالة.","هدفه اختبار التصميم وأفكار المنتج قبل تصنيعه. من غير اختبار بدري هتتجرب أول مرة في السوق وغالبًا الملاحظات سلبية؛ النماذج بتجمع الملاحظات في مرحلة البحث قليلة المخاطر.","الدقة هي مدى قرب النموذج من شكل وإحساس المنتج النهائي، في ثلاثة محاور: التصميم البصري والمحتوى والتفاعلية. الفريق يختارها حسب الهدف واكتمال التصميم والموارد، بين طرفين: منخفضة وعالية."]],
["الدقة المنخفضة Lo-Fi: النموذج الورقي","p",["سريعة ورخيصة وسهلة، بتحوّل الأفكار لشيء ملموس قابل للاختبار بخامة غير خامة المنتج (ورق أو كرتون). أهم دورها فحص الوظيفة مش الشكل.","النموذج الورقي: رسومات على ورق تحاكي الواجهة. عيبه إنه محتاج شخصين على الأقل: ميسّر يلعب دور الكمبيوتر ويبدّل الشاشات الورقية، والمشارك يجرب."]],
["القصة المصورة Storyboard","s",["سلسلة رسومات توضح تقدم المستخدم في مهمة باستخدام المنتج.","غالبًا بتتستخدم مع السيناريوهات، وبتضيف تفاصيل وبتخلي أصحاب المصلحة يمثلوا التفاعل."]],
["المخططات القابلة للنقر Clickable Wireframes","x",["الـ Wireframe تمثيل بصري لصفحة المنتج لترتيب عناصرها. لما نربط مخططات ثابتة ببعضها نحصل على أبسط نموذج تفاعلي.","مميزاتها: ما تحتاجش ميسّر بشري وقت الاختبار، التخطيط يتعدل بسهولة حسب الملاحظات، وبنعيد استخدام مخرجات التصميم الموجودة."]],
["ساحر أوز Wizard-of-Oz","w",["المستخدم يظن إنه بيتعامل مع كمبيوتر، لكن مشغّل بشري بيرد سرًا بدل النظام."]],
["الدقة العالية Hi-Fi","d",["بتبان وتشتغل أقرب ما يمكن للمنتج النهائي وبخاماته، ويعملها الفريق لما يفهم اللي هيبنيه ويحتاج موافقة نهائية أو اختبار مع مستخدمين حقيقيين: تصميم واقعي ومحتوى حقيقي وتفاعلية واقعية.","المميزات: ملاحظات ذات معنى لأن المشاركين يتصرفوا طبيعي، اختبار عناصر محددة (رسوم، Affordances، انتقالات، تفاعلات دقيقة)، وإقناع العملاء بسهولة.","العيوب: أغلى وأبطأ في التطوير والتعديل، ومش مناسبة لإثبات فكرة بسيطة، والمستخدم قد يظنها منتج نهائي ويتوقع أكتر.","أنواعها: نماذج رقمية ببرامج متخصصة بحركات معقدة، ونماذج مبرمجة قريبة جدًا من النسخة النهائية لمن يثق في مهاراته."]],
["الدرس 5.1: التقييم Evaluation",null,["التقييم جمع وتحليل بيانات عن تجربة المستخدمين مع التصاميم لقياس قابلية الاستخدام وتجربة المستخدم، وهو جزء من دورات: صمّم، ابنِ، اختبر، أعد التصميم. أهدافه: تحسين التصميم والتحقق من الاستخدام وضمان الرضا والكفاءة، وتصميم مناسب للمستخدمين المستهدفين مش للمصمم.","لماذا؟ للتحقق ولأسباب تجارية وإصلاح المشاكل قبل البيع. ماذا؟ من نماذج بسيطة لأنظمة كاملة، وخصائص وسير عمل وجماليات وسلامة.","أين؟ معمل مضبوط، أو بيئة طبيعية In-the-wild بصلاحية بيئية عالية، أو معمل حي Living Lab هجين. متى؟ أثناء التصميم (تكويني)، بعد الإطلاق (ختامي)، أو باستمرار بدورات سريعة."]],
["التكويني مقابل الختامي وأنواع الإعدادات",null,["التكويني Formative: أثناء التصميم للتأكد إن المنتج يحقق المتطلبات وتحسينه قبل الإطلاق، من اختبار رسومات مبكرة لضبط تصميم شبه نهائي. الختامي Summative: بعد النشر لتقييم نجاح المنتج وتحديد ما يحتاج تحسين عند الترقية.","إعدادات مضبوطة: اختبارات وتجارب، تحكم عالٍ ومهام محددة، تركيز على الفرضيات والكفاءة ونسب الخطأ. إعدادات طبيعية: دراسات ميدانية وإثنوجرافيا، تحكم منخفض، تركيز على الاستخدام والسلوك.","بدون مستخدمين مباشرين: فحص الخبراء والتقييم الإرشادي والـ Cognitive Walk-through والنمذجة والتحليلات، للتنبؤ والتشخيص."]],
["أخلاقيات البحث والسلامة",null,["لازم المصمم يظهر تعاطف ومسؤولية اجتماعية لحماية المشاركين جسديًا ونفسيًا وخصوصيتهم. لجنة IRB تحدد صيغة صارمة وتراجع التجارب وتتأكد من السلامة والامتثال وحقوق المشاركين.","الموافقة المستنيرة: نموذج يوضح المطلوب ومدة الدراسة واستخدام البيانات واتفاقيات السرية. حق الانسحاب: للمشارك في أي وقت بدون عقاب، وبياناته ما تُستخدم.","الفئات الضعيفة (أطفال، كبار سن، ذوي إعاقات) تحتاج تعاطف أكبر ومراجعة أشد، مثل موافقة الوالدين للأطفال، مع موازنة دقة البيانات بخصوصية وراحة الفرد."]],
["اختبار قابلية الاستخدام وجودة التقييم",null,["الاختبار في معمل مخصص بدون ضوضاء أو نوافذ أو زملاء ليركز المستخدم؛ يعطي بيانات أداء نظيفة لكنه ما يقيسش المقاطعات الواقعية.","البروتوكول: موافقة موقّعة، مهام بترتيب عشوائي أو متوازن لتفادي التحيز، ميسّر يجلس مع المشارك يلاحظ ويكتب وتسجيل فيديو، وتقنية التفكير بصوت عالٍ Think-Aloud.","مبادئ الجودة: Validity هل يقيس فعلًا ما يدّعي؟ Ecological Validity واقعية الظروف. Reliability ثبات النتائج. Bias تحيز، مثل اختيار خبراء ومعاملتهم كمبتدئين. Scope إمكانية التعميم."]],
["الدرس 5.2: التقييم الإرشادي Heuristic Evaluation",null,["لما يصعب إشراك مستخدمين نستخدم الفحص والتحليلات والنماذج التنبؤية في أي مرحلة، كمكمّل لاختبار الاستخدام. في التقييم الإرشادي (جاكوب نيلسن) يمر الخبراء على الواجهة عدة مرات ويقارنوها بمبادئ الاستخدام ويقترحوا حلولًا.","1 ظهور حالة النظام: تغذية راجعة في وقت معقول. 2 التطابق مع العالم الحقيقي: لغة المستخدم. 3 تحكم المستخدم وحريته: مخرج طوارئ مثل التراجع والإعادة. 4 الاتساق والمعايير. 5 منع الأخطاء: إزالة الظروف المسببة أو طلب التأكيد."]],
["بقية المبادئ العشرة",null,["6 التعرف بدل التذكر: خلّي العناصر والخيارات ظاهرة. 7 المرونة والكفاءة: اختصارات للخبراء مخفية عن المبتدئين.","8 تصميم جمالي ومينيمال: لا معلومات غير مهمة لأنها تنافس المهم. 9 مساعدة المستخدم يتعرف على الأخطاء ويتعافى: رسائل بلغة بسيطة تحدد المشكلة وتقترح حل. 10 المساعدة والتوثيق: سهلة البحث ومركزة على المهمة بخطوات محددة."]],
["Walk-Through والتحليلات وقانون فيتس",null,["Cognitive Walk-Through: محاكاة تفكير المستخدم في كل خطوة لتقييم سهولة التعلم. أسئلته: هل الفعل الصحيح واضح؟ هل سيلاحظ المستخدم إنه متاح؟ هل سيفهم الاستجابة ويعرف إن اختياره صح؟","Web Analytics: قياس وتحليل بيانات الإنترنت لفهم الاستخدام، مثل Google Analytics: الزوار والأجهزة والمواقع ومتوسط الوقت. معدل الارتداد Bounce Rate نسبة من شاهدوا صفحة واحدة وخرجوا.","A/B Testing: إصدارات مختلفة لمجموعات منفصلة وغالبًا لا يعلموا، ونقارن الأرقام لمعرفة الأفضل. قانون فيتس: يتنبأ بزمن الوصول لهدف بجهاز مؤشر حسب حجم الهدف ومسافته، لتحديد مكان وحجم الأزرار."]],
["الدرس 5.3: المعمل مقابل In-the-wild",null,["البيئات الطبيعية: تحكم منخفض لكن صلاحية بيئية عالية جدًا، والتركيز على السياق والسلوك الطبيعي.","المعمل ممتاز لاكتشاف مشاكل محددة، لكنه يلغي المقاطعات الواقعية فيصعب معرفة الاستخدام الفعلي.","In-the-wild: نشر تقنيات أو نماذج في أماكن حقيقية لنكتشف كيف يقاربها المستخدمون أولًا، وفوائدها في حياتهم، وكيف يتطور الاستخدام مع الوقت وكيف تغيّر سلوكهم."]],
["دراسات حالة ودراسات ميدانية طويلة",null,["Painpad: جهاز لمرضى جراحات العظام يسجلوا ألمهم، اختُبر في جناح مستشفى لأن المعمل لا يحاكي الزوار وجولات الأطباء ولا الألم الحقيقي. النتيجة: التزام أكبر بمواعيد التسجيل ودرجات ألم أكتر مما مع الممرضات.","واتساب Voice Notes: الناس تتجنب كتابة رسائل طويلة أثناء المشي أو الانشغال، فتأكدت أهمية الرسائل الصوتية.","Snapchat 2018: تصميم جديد بدمج المحادثات بقصص المشاهير من غير اختبار واسع مع مستخدمين عاديين، فتذمر الملايين وانخفضت التقييمات وخسر مستخدمين مؤقتًا.","دراسة ميدانية لأدوات الخبراء: مقابلة أولية، تدريب، 2 إلى 4 أسابيع استخدام مبتدئ ثم 2 إلى 4 أسابيع متمرس، بيانات من مذكرات يومية وسجلات واستبيانات، ثم مقابلة ختامية شبه منظمة."]]
];

["Unit 4 – Lesson 4.1: The UI Layer",["The UI layer is software that runs above the operating system and below the application, and it carries out the interaction with the user.","An interrupt is a signal telling the processor that an event happened and must be handled, so it pauses its work temporarily and then continues.","Its opposite is polling (busy waiting): the processor loops and keeps asking the device for its status. This wastes CPU time and is poor for asynchronous, user-driven input.","So interactive programs use an event-driven architecture: programs are written in terms of events (mouse clicks, gestures, keyboard input) and their handlers."]],
["Events, UI objects, and event handlers",["A window is the most basic UI object: a rectangle of the screen used for interaction. An app has a top window containing all other widgets: buttons, menus, icons, forms, and dialog boxes.","Steps: first, physical input arrives from an input device. Second, it becomes an event holding the user’s intent. Third, the operating system places it in the application event queue. Fourth, it is dispatched by the current focus to the right event handler.","Program structure: set up the UI objects and their handlers, then enter a continuous loop that removes events from the queue and dispatches them. In the picture, clicking “Pay Now” in a shopping cart becomes an event, enters the queue, and the dispatcher checks the focus and runs the payment handler."]],
["Night Mode example: from touch to event",["Physical input: the user taps the moon icon. The touch sensor detects a change in current at coordinates such as x=120, y=350 and sends them to the operating system as an interrupt.","Event generation: the OS does not pass raw coordinates along. It wraps them in an Event Object holding the action type (TOUCH_DOWN), its location, and a timestamp. This turns a physical touch into a digital message the app understands.","Event queue: a FIFO (first in, first out) line. The app stays responsive even when busy with a heavy task, because the request waits safely for its turn."]],
["Night Mode example: dispatching and the handler",["Dispatching: the Event Loop is the heart of the program. It pulls events one by one, compares their coordinates with the positions of the widgets, finds them inside the Night Mode button, and sends the event to it.","Event handler: every interactive object has a handler (a callback) holding its logic. Here it changes the theme variable from light to dark (state change) and tells the graphics engine to redraw the background black and swap the moon for a sun (UI update).","Metaphors: UI object = light switch, event = letter in an envelope, queue = in-box on a desk, loop = sorting machine, handler = instruction manual."]],
["UI toolkits",["Developers rarely build these systems from scratch. A UI toolkit is a library of ready-made UI objects (with their handlers) and predefined events built on the execution framework. It brings standardization, familiarity, fast implementation, and platform consistency.","Java AWT: an object-oriented class library for 2D interfaces and graphics.","Android: UI components (images, buttons) are declared in XML files, while handlers are written in Java.","iOS UIKit: handles three kinds of discrete events: multitouch, motion, and remote control. It captures touches, packages them into a UIEvent, and places it in the app’s event queue for the view to process."]],
["MVC: Model, View, Controller",["MVC is a modular development framework built on separating the UI from the core computational functions, so parts can be mixed, matched, and maintained easily. Rule: MVC separates what you see from how it is calculated.","Model: data, logic, and computation; it knows nothing about presentation or input. View: outputs and presents data. Controller: handles user input, decides which view is in focus, and talks to the Model to update data.","Calculator: the screen is the View (it only lights up digits). The buttons are the Controller (pressing 2 tells the Model). The internal chip is the Model (it computes 2+3=5, stores it, and returns it to the Controller, which shows it)."]],
["MVC example: ordering coffee, and the benefits",["View is the menu or the finished coffee. Controller is the cashier. Model is the barista and kitchen, with the ingredients and the recipe.","Flow: you look at the menu, tell the cashier “Latte”, the cashier tells the barista, the barista makes it using the recipe and says “done”, and the cashier hands you the latte.","Benefits: a new menu design changes only the View, and the recipe stays the same. A new health code changes only the Model, and the cashier works the same way. A mobile ordering app swaps the Controller, and the kitchen is unaffected."]],
["Lesson 4.2: Prototypes and fidelity",["A prototype is an expression of design intent. It lets designers present ideas, communicate with the team, and see ideas in action.","Its main goal is to test designs and product ideas before building the real product. Without early testing, a concept is first tested on the market, and feedback is likely negative. Prototypes collect feedback during the low-risk research phase.","Fidelity is how closely a prototype conveys the look and feel of the final product, across three areas: visual design, content, and interactivity. Teams choose it based on goals, how complete the design is, and resources, between two extremes: low and high."]],
["Low-fidelity: paper prototyping",["Quick, cheap, and easy: it turns ideas into tangible, testable artifacts using a medium unlike the final product (paper or cardboard). Its most important role is checking functionality, not visual appearance.","Paper prototyping uses sketches on paper to simulate interfaces. Limitation: it needs at least two people, a facilitator who acts as the computer and swaps the paper screens, and the participant who tests."]],
["Storyboarding",["A series of sketches showing how a user progresses through a task with the product.","Often used with scenarios; it adds detail and lets stakeholders role-play the interaction."]],
["Clickable wireframes",["A wireframe is a visual representation of a product page used to arrange its elements. Linking static wireframes together gives the simplest interactive prototype.","Benefits: no separate human facilitator during testing, layouts adapt easily to feedback, and existing design deliverables are reused. They give basic usability testing of the logical flow."]],
["Wizard-of-Oz",["The user thinks they are interacting with a computer, but a human operator is secretly responding instead of the system."]],
["High-fidelity prototypes",["They look and work as much like the shipped product as possible, using final-product materials. Teams build them when they know what they will build and need final approval or testing with real users: realistic visuals, real content, realistic interactivity.","Advantages: meaningful feedback because participants behave naturally; testing of specific elements (graphics, affordances, animated transitions, micro-interactions); easy buy-in from clients and stakeholders.","Disadvantages: more resource-intensive and slower to build and change; inefficient for basic proof of concept; users may mistake them for a finished product and expect more.","Techniques: digital prototypes made with specialized software, full of complex animation; and coded prototypes, very close to the release version, recommended only for designers confident in coding."]],
["Lesson 5.1: Evaluation",["Evaluation is collecting and analyzing data about users’ experiences with design artifacts to assess usability and user experience. It sits inside iterative cycles of design, build, test, and redesign. Goals: improve the design, validate usability, ensure satisfaction, efficiency, and engagement, and design for the target users rather than for yourself.","Why? To validate usability, for business reasons, and to fix problems before sale. What? Anything from low-fidelity prototypes to whole systems, features, workflows, aesthetics, and safety.","Where? A controlled lab, a natural in-the-wild setting with high ecological validity, or a living lab (a hybrid). When? During design (formative), after deployment (summative), or continuously in rapid cycles."]],
["Formative vs. summative, and settings",["Formative: during design, to check the product meets requirements and refine it before release, from testing early sketches to tweaking a nearly finished design. Summative: after deployment, to assess the success of the finished product and decide what to improve in an upgrade.","Controlled settings: usability tests and experiments, high control and defined tasks, focused on hypotheses, efficiency, and error rates. Natural settings: field studies and ethnography, low control, focused on contextual use and behavior.","No direct user involvement: expert inspection, heuristic evaluation, cognitive walk-throughs, modeling, and analytics, used for prediction and diagnosis."]],
["Research ethics and safety",["Designers must show empathy and social responsibility to protect participants physically and emotionally, and protect their privacy. An Institutional Review Board (IRB) prescribes strict formats, reviews experiments, and checks safety, compliance, and participants’ rights.","Informed consent: a form explaining what participants will do, the study length, how data is used, and confidentiality. Right to withdraw: at any time without penalty, and none of their data is used.","Vulnerable groups (children, older adults, people with disabilities) need more empathy and stricter review, for example parental consent for children, balancing accurate data with comfort, privacy, and well-being."]],
["Usability testing and quality principles",["Testing happens in a purpose-built lab with no noise, windows, or co-workers so users can concentrate. It gives clean performance data but cannot measure real-world interruptions.","Protocol: signed informed consent; tasks in random or balanced order to avoid bias; a moderator sits with the participant, observes, and takes notes, with video recording; and the think-aloud technique.","Quality principles: validity (does it measure what it claims?), ecological validity (how realistic are the conditions?), reliability (are results consistent?), bias (such as picking experienced users and treating them as new), and scope (how far results generalize)."]],
["Lesson 5.2: Heuristic evaluation",["When involving users is hard (time, availability, finding participants), use inspections, analytics, and predictive models at any stage, as a complement to usability testing. In heuristic evaluation (Jakob Nielsen) experts pass through the interface several times, compare elements to usability principles, find problems, and suggest fixes.","1 Visibility of system status: feedback within reasonable time. 2 Match between system and real world: the user’s language. 3 User control and freedom: an emergency exit such as undo and redo. 4 Consistency and standards. 5 Error prevention: remove error-prone conditions or ask for confirmation."]],
["The rest of the ten heuristics",["6 Recognition rather than recall: keep objects and options visible. 7 Flexibility and efficiency: accelerators for experts, unseen by novices.","8 Aesthetic and minimalist design: no irrelevant information, since it competes with what matters. 9 Help users recognize, diagnose, and recover from errors: plain-language messages that state the problem and suggest a solution. 10 Help and documentation: searchable, task-focused, with concrete steps."]],
["Walk-throughs, analytics, and Fitts’ Law",["Cognitive walk-through: simulating the user’s problem-solving at each step to evaluate ease of learning. Questions: will the correct action be evident? Will the user notice it is available? Will they understand the response and know if their choice was right?","Web analytics: measuring and analyzing internet data to understand usage, for example Google Analytics: visitors, devices, locations, and average time. Bounce rate is the percentage of visitors who view one page and leave.","A/B testing: different versions go to separate groups of users, who usually do not know, and the numbers show which scores higher. Fitts’ Law predicts the time to reach a target with a pointing device from its size and distance, guiding button placement, size, and spacing."]],
["Lesson 5.3: Lab vs. in-the-wild",["Natural settings: low control but very high ecological validity, focused on context and natural behavior.","The lab is excellent for finding specific usability issues, but it removes real-world interruptions, so actual daily use is hard to discern.","In-the-wild: deploying technologies or prototypes in real settings to see how users first approach them, the real benefits in daily life, how use evolves over time, and how it changes or disrupts behavior."]],
["Case studies and long field studies",["Painpad: a device for patients recovering from hip surgery to log their pain, tested in a hospital ward because a lab cannot simulate visitors, doctors’ rounds, or real pain. Result: patients stuck to recording times more and submitted more pain scores than with nurses.","WhatsApp voice notes: people avoid typing long messages while walking or multitasking, which confirmed the value of voice notes.","Snapchat 2018: a redesign mixing chats with celebrity stories, launched without wide testing with everyday users. Millions complained, ratings fell, and users were lost temporarily.","Long field study for expert tools: initial interview, introductory training, 2 to 4 weeks of novice use then 2 to 4 weeks of mature use, data from daily diaries, logs, and questionnaires, then a semi-structured exit interview."]]
